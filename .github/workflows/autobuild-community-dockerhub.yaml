name: autobuild-community-dockerhub
run-name: community-dockerhub-build (${{ github.ref_name }})

# Runner selection order (first non-empty wins):
#   1. workflow_dispatch input "runner" (per-run override)
#   2. repository variable BUILD_RUNNER (persistent default)
#   3. fallback to "linux"
#
# Set BUILD_RUNNER at: Settings -> Secrets and variables -> Actions -> Variables.
# Accepted values: "macos" | "linux". Anything else falls back to linux.

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner target (blank = use BUILD_RUNNER var; default macos)"
        type: choice
        options:
          - ""
          - macos
          - linux
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: autobuild-community-dockerhub-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXUS_URL: ${{ vars.NEXUS_URL || secrets.NEXUS_URL }}
  NEXUS_REPOSITORY: ${{ vars.NEXUS_REPOSITORY || secrets.NEXUS_REPOSITORY }}
  NEXUS_ARTIFACT_PREFIX: ${{ vars.NEXUS_ARTIFACT_PREFIX || secrets.NEXUS_ARTIFACT_PREFIX }}
  NEXUS_USERNAME: ${{ vars.NEXUS_USERNAME || secrets.NEXUS_USERNAME }}
  NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD || vars.NEXUS_PASSWORD }}

jobs:
  quality:
    uses: ./.github/workflows/_autobuild-community-quality.yaml

  init:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.runner.outputs.runner }}
      hosted: ${{ steps.runner.outputs.hosted }}
      storage_backend: ${{ steps.storage.outputs.storage_backend }}
      image: ${{ steps.meta.outputs.image }}
      tags: ${{ steps.meta.outputs.tags }}
      alpine_digest: ${{ steps.alpine.outputs.digest }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: resolve-runner
        id: runner
        shell: bash
        env:
          INPUT_RUNNER: ${{ inputs.runner }}
          VAR_RUNNER: ${{ vars.BUILD_RUNNER }}
        run: |
          set -euo pipefail
          RUNNER="${INPUT_RUNNER}"
          if [[ -z "${RUNNER}" ]]; then
            RUNNER="${VAR_RUNNER}"
          fi
          if [[ "${RUNNER}" != "macos" && "${RUNNER}" != "linux" ]]; then
            RUNNER="linux"
          fi
          echo "runner=${RUNNER}" >> "${GITHUB_OUTPUT}"

          # hosted=true → GitHub-hosted runner, which cannot reach private-network
          # services (e.g. the internal Nexus). Downstream steps use this to pick
          # the artifact staging backend.
          HOSTED="true"
          if [[ "${RUNNER}" == "macos" ]]; then
            HOSTED="false"
          fi
          echo "hosted=${HOSTED}" >> "${GITHUB_OUTPUT}"

      - name: resolve-storage
        id: storage
        shell: bash
        env:
          RUNNER_HOSTED: ${{ steps.runner.outputs.hosted }}
        run: |
          set -euo pipefail
          # Mirrors the sub2api release pipeline: Nexus staging only on
          # self-hosted runners with complete NEXUS_* config; GitHub-hosted
          # runners always stage through actions/upload-artifact.
          STORAGE_BACKEND="github-artifact"
          if [[ "${RUNNER_HOSTED}" != "true" && -n "${NEXUS_URL:-}" && -n "${NEXUS_REPOSITORY:-}" && -n "${NEXUS_USERNAME:-}" && -n "${NEXUS_PASSWORD:-}" ]]; then
            STORAGE_BACKEND="nexus"
          fi
          echo "storage_backend=${STORAGE_BACKEND}" >> "${GITHUB_OUTPUT}"
          echo "Staging build artifacts via: ${STORAGE_BACKEND}"

      - name: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: compute-image-metadata
        id: meta
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail

          if [[ -n "${DOCKERHUB_IMAGE}" ]]; then
            IMAGE="${DOCKERHUB_IMAGE}"
          else
            if [[ -z "${DOCKERHUB_USERNAME}" ]]; then
              echo "DOCKERHUB_USERNAME secret or variable is required when DOCKERHUB_IMAGE variable is not set"
              exit 1
            fi
            IMAGE="${DOCKERHUB_USERNAME}/signoz-community"
          fi

          IMAGE="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"
          REF_SAFE="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"

          TAGS="${IMAGE}:${REF_SAFE}-${SHORT_SHA}"

          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            TAGS="${TAGS},${IMAGE}:${REF_SAFE}"
          fi

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"
          fi

          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

      - name: resolve-alpine-digest
        id: alpine
        shell: bash
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect alpine:3.20.3 --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST#sha256:}" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: init
    if: ${{ needs.init.outputs.runner == 'macos' }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: verify-go-toolchain
        shell: bash
        run: |
          set -euo pipefail
          # Some self-hosted runners inject goenv shims and stale GOROOT values.
          # Prefer setup-go's toolchain path and allow auto-upgrade to go.mod toolchain.
          if [[ -n "${GOROOT:-}" && -x "${GOROOT}/bin/go" ]]; then
            export PATH="${GOROOT}/bin:${PATH}"
          fi
          unset GOENV_VERSION || true
          unset GOROOT || true
          export GOTOOLCHAIN=auto
          echo "PATH=${PATH}"
          which -a go
          go version
          go env GOROOT GOTOOLCHAIN

      - name: use-system-node-if-available
        id: node
        shell: bash
        run: |
          set -euo pipefail
          if command -v node >/dev/null 2>&1; then
            NODE_VERSION="$(node -v | sed 's/^v//')"
            NODE_MAJOR="${NODE_VERSION%%.*}"
            if [[ "${NODE_MAJOR}" == "22" ]]; then
              echo "skip_setup=true" >> "${GITHUB_OUTPUT}"
              echo "version=${NODE_VERSION}" >> "${GITHUB_OUTPUT}"
              echo "Using preinstalled Node ${NODE_VERSION}"
              exit 0
            fi
          fi
          echo "skip_setup=false" >> "${GITHUB_OUTPUT}"

      - name: setup-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: setup-node
        if: ${{ steps.node.outputs.skip_setup != 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: verify-node
        shell: bash
        run: |
          set -euo pipefail
          node -v
          pnpm --version

      - name: verify-docker
        shell: bash
        run: |
          set -euo pipefail
          if ! docker info >/dev/null 2>&1; then
            echo "Docker Desktop is not running on this self-hosted runner."
            exit 1
          fi

      - name: build-frontend
        env:
          VITE_APPCUES_APP_ID: ""
          VITE_PYLON_APP_ID: ""
          VITE_PYLON_IDENTITY_SECRET: ""
        run: make js-build

      - name: build-community-binaries
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GOROOT:-}" && -x "${GOROOT}/bin/go" ]]; then
            export PATH="${GOROOT}/bin:${PATH}"
          fi
          unset GOENV_VERSION || true
          unset GOROOT || true
          export GOTOOLCHAIN=auto
          go version
          make go-build-community OS=linux

      - name: pack-build-artifacts
        shell: bash
        run: |
          set -euo pipefail
          tar -czf community-build.tar.gz target frontend/build

      - name: upload-build-artifacts-to-nexus
        if: ${{ needs.init.outputs.storage_backend == 'nexus' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${NEXUS_URL:?NEXUS_URL is required}"
          : "${NEXUS_REPOSITORY:?NEXUS_REPOSITORY is required}"
          : "${NEXUS_USERNAME:?NEXUS_USERNAME is required}"
          : "${NEXUS_PASSWORD:?NEXUS_PASSWORD is required}"

          ARTIFACT_PREFIX="${NEXUS_ARTIFACT_PREFIX:-infra/signoz/community-build}"
          ARTIFACT_PREFIX="${ARTIFACT_PREFIX%/}"
          ARTIFACT_PATH="${ARTIFACT_PREFIX}/${GITHUB_RUN_ID}.tar.gz"
          NEXUS_UPLOAD_URL="${NEXUS_URL%/}/repository/${NEXUS_REPOSITORY}/${ARTIFACT_PATH}"

          curl -fS --retry 3 --retry-all-errors \
            -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
            --upload-file community-build.tar.gz \
            "${NEXUS_UPLOAD_URL}"

      - name: upload-build-artifacts
        if: ${{ needs.init.outputs.storage_backend != 'nexus' }}
        uses: actions/upload-artifact@v7
        with:
          name: community-build
          path: community-build.tar.gz
          retention-days: 1

  build-linux:
    needs: init
    if: ${{ needs.init.outputs.runner == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: verify-go-toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GOROOT:-}" && -x "${GOROOT}/bin/go" ]]; then
            export PATH="${GOROOT}/bin:${PATH}"
          fi
          unset GOENV_VERSION || true
          unset GOROOT || true
          export GOTOOLCHAIN=auto
          which -a go
          go version
          go env GOROOT GOTOOLCHAIN

      - name: setup-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: setup-node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: build-frontend
        env:
          VITE_APPCUES_APP_ID: ""
          VITE_PYLON_APP_ID: ""
          VITE_PYLON_IDENTITY_SECRET: ""
        run: make js-build

      - name: build-community-binaries
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GOROOT:-}" && -x "${GOROOT}/bin/go" ]]; then
            export PATH="${GOROOT}/bin:${PATH}"
          fi
          unset GOENV_VERSION || true
          unset GOROOT || true
          export GOTOOLCHAIN=auto
          go version
          make go-build-community

      - name: pack-build-artifacts
        shell: bash
        run: |
          set -euo pipefail
          tar -czf community-build.tar.gz target frontend/build

      - name: upload-build-artifacts-to-nexus
        if: ${{ needs.init.outputs.storage_backend == 'nexus' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${NEXUS_URL:?NEXUS_URL is required}"
          : "${NEXUS_REPOSITORY:?NEXUS_REPOSITORY is required}"
          : "${NEXUS_USERNAME:?NEXUS_USERNAME is required}"
          : "${NEXUS_PASSWORD:?NEXUS_PASSWORD is required}"

          ARTIFACT_PREFIX="${NEXUS_ARTIFACT_PREFIX:-infra/signoz/community-build}"
          ARTIFACT_PREFIX="${ARTIFACT_PREFIX%/}"
          ARTIFACT_PATH="${ARTIFACT_PREFIX}/${GITHUB_RUN_ID}.tar.gz"
          NEXUS_UPLOAD_URL="${NEXUS_URL%/}/repository/${NEXUS_REPOSITORY}/${ARTIFACT_PATH}"

          curl -fS --retry 3 --retry-all-errors \
            -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
            --upload-file community-build.tar.gz \
            "${NEXUS_UPLOAD_URL}"

      - name: upload-build-artifacts
        if: ${{ needs.init.outputs.storage_backend != 'nexus' }}
        uses: actions/upload-artifact@v7
        with:
          name: community-build
          path: community-build.tar.gz
          retention-days: 1

  push-macos:
    needs:
      - init
      - build-macos
    if: ${{ needs.init.outputs.runner == 'macos' }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: verify-docker
        shell: bash
        run: |
          set -euo pipefail
          if ! docker info >/dev/null 2>&1; then
            echo "Docker Desktop is not running on this self-hosted runner."
            exit 1
          fi

      - name: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: download-build-artifacts-from-nexus
        if: ${{ needs.init.outputs.storage_backend == 'nexus' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${NEXUS_URL:?NEXUS_URL is required}"
          : "${NEXUS_REPOSITORY:?NEXUS_REPOSITORY is required}"
          : "${NEXUS_USERNAME:?NEXUS_USERNAME is required}"
          : "${NEXUS_PASSWORD:?NEXUS_PASSWORD is required}"

          ARTIFACT_PREFIX="${NEXUS_ARTIFACT_PREFIX:-infra/signoz/community-build}"
          ARTIFACT_PREFIX="${ARTIFACT_PREFIX%/}"
          ARTIFACT_PATH="${ARTIFACT_PREFIX}/${GITHUB_RUN_ID}.tar.gz"
          NEXUS_DOWNLOAD_URL="${NEXUS_URL%/}/repository/${NEXUS_REPOSITORY}/${ARTIFACT_PATH}"

          rm -f community-build.tar.gz
          curl -fS --retry 3 --retry-all-errors \
            -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
            -o community-build.tar.gz \
            "${NEXUS_DOWNLOAD_URL}"
          tar -xzf community-build.tar.gz

      - name: download-build-artifacts
        if: ${{ needs.init.outputs.storage_backend != 'nexus' }}
        uses: actions/download-artifact@v8
        with:
          name: community-build

      - name: extract-build-artifacts
        if: ${{ needs.init.outputs.storage_backend != 'nexus' }}
        shell: bash
        run: tar -xzf community-build.tar.gz

      - name: login-dockerhub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: resolve-image-tags
        id: tags
        shell: bash
        env:
          UPSTREAM_TAGS: ${{ needs.init.outputs.tags }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail
          TAGS="${UPSTREAM_TAGS}"

          if [[ -z "${TAGS}" ]]; then
            if [[ -n "${DOCKERHUB_IMAGE}" ]]; then
              IMAGE="${DOCKERHUB_IMAGE}"
            else
              if [[ -z "${DOCKERHUB_USERNAME}" ]]; then
                echo "DOCKERHUB_USERNAME secret or variable is required when DOCKERHUB_IMAGE variable is not set"
                exit 1
              fi
              IMAGE="${DOCKERHUB_USERNAME}/signoz-community"
            fi

            IMAGE="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
            SHORT_SHA="${GITHUB_SHA::7}"
            REF_SAFE="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"

            TAGS="${IMAGE}:${REF_SAFE}-${SHORT_SHA}"

            if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
              TAGS="${TAGS},${IMAGE}:${REF_SAFE}"
            fi

            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              TAGS="${TAGS},${IMAGE}:latest"
            fi

            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"
            fi
          fi

          if [[ -z "${TAGS}" ]]; then
            echo "resolved empty docker tags"
            exit 1
          fi

          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "Using docker tags: ${TAGS}"

      - name: build-and-push-community-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/community/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          build-args: |
            ALPINE_SHA=${{ needs.init.outputs.alpine_digest }}

      - name: cleanup-docker
        if: always()
        shell: bash
        run: docker system prune -f || true

  push-linux:
    needs:
      - init
      - build-linux
    if: ${{ needs.init.outputs.runner == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup-qemu
        uses: docker/setup-qemu-action@v3

      - name: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: download-build-artifacts-from-nexus
        if: ${{ needs.init.outputs.storage_backend == 'nexus' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${NEXUS_URL:?NEXUS_URL is required}"
          : "${NEXUS_REPOSITORY:?NEXUS_REPOSITORY is required}"
          : "${NEXUS_USERNAME:?NEXUS_USERNAME is required}"
          : "${NEXUS_PASSWORD:?NEXUS_PASSWORD is required}"

          ARTIFACT_PREFIX="${NEXUS_ARTIFACT_PREFIX:-infra/signoz/community-build}"
          ARTIFACT_PREFIX="${ARTIFACT_PREFIX%/}"
          ARTIFACT_PATH="${ARTIFACT_PREFIX}/${GITHUB_RUN_ID}.tar.gz"
          NEXUS_DOWNLOAD_URL="${NEXUS_URL%/}/repository/${NEXUS_REPOSITORY}/${ARTIFACT_PATH}"

          rm -f community-build.tar.gz
          curl -fS --retry 3 --retry-all-errors \
            -u "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
            -o community-build.tar.gz \
            "${NEXUS_DOWNLOAD_URL}"
          tar -xzf community-build.tar.gz

      - name: download-build-artifacts
        if: ${{ needs.init.outputs.storage_backend != 'nexus' }}
        uses: actions/download-artifact@v8
        with:
          name: community-build

      - name: extract-build-artifacts
        if: ${{ needs.init.outputs.storage_backend != 'nexus' }}
        shell: bash
        run: tar -xzf community-build.tar.gz

      - name: login-dockerhub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: resolve-image-tags
        id: tags
        shell: bash
        env:
          UPSTREAM_TAGS: ${{ needs.init.outputs.tags }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail
          TAGS="${UPSTREAM_TAGS}"

          if [[ -z "${TAGS}" ]]; then
            if [[ -n "${DOCKERHUB_IMAGE}" ]]; then
              IMAGE="${DOCKERHUB_IMAGE}"
            else
              if [[ -z "${DOCKERHUB_USERNAME}" ]]; then
                echo "DOCKERHUB_USERNAME secret or variable is required when DOCKERHUB_IMAGE variable is not set"
                exit 1
              fi
              IMAGE="${DOCKERHUB_USERNAME}/signoz-community"
            fi

            IMAGE="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
            SHORT_SHA="${GITHUB_SHA::7}"
            REF_SAFE="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"

            TAGS="${IMAGE}:${REF_SAFE}-${SHORT_SHA}"

            if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
              TAGS="${TAGS},${IMAGE}:${REF_SAFE}"
            fi

            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              TAGS="${TAGS},${IMAGE}:latest"
            fi

            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"
            fi
          fi

          if [[ -z "${TAGS}" ]]; then
            echo "resolved empty docker tags"
            exit 1
          fi

          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "Using docker tags: ${TAGS}"

      - name: build-and-push-community-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/community/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          build-args: |
            ALPINE_SHA=${{ needs.init.outputs.alpine_digest }}
